description: >-
  FinOps view of Trengo spend. Trengo bills a per-seat subscription (Boost,
  Pro, Enterprise) that bundles included users and a monthly/annual
  conversation allowance, plus usage-based overages for additional
  conversations, AI-powered conversations, and additional seats. The REST API
  is not separately metered; programmatic activity consumes the same
  conversation and seat pools as the inbox UI.
notes: >-
  Per-seat and per-conversation rates are published in EUR on the Trengo
  pricing page and vary by billing term and region; verify on reconciliation.
  WhatsApp/Meta conversation charges flowing through Trengo are governed by the
  underlying channel provider and may appear as pass-through costs.
sources:
- https://trengo.com/pricing
- https://trengo.com/api
- https://developers.trengo.com/docs/welcome
